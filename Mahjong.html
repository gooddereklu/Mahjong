<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>輕鬆麻將 (16張)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a472a; /* Classic Mahjong green */
            background-image: radial-gradient(circle, #2a5a3a 0%, #10301a 100%);
            color: white;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            touch-action: manipulation; /* Prevent double-tap zoom on iPad */
            overflow: hidden; /* Prevent scrolling */
        }
        
        .tile-font {
            /* Apple Color Emoji renders Mahjong tiles beautifully on iPads/Macs */
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
            line-height: 1;
        }

        .tile {
            background-color: #fdfbf7;
            color: #000;
            border-radius: 8px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.4), inset -1px -2px 4px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .player-tile {
            font-size: 6.5vw; /* Scales with iPad width, approx 60-70px */
            width: 5.2vw;
            height: 7.2vw;
            cursor: pointer;
        }

        .player-tile.discard-mode:hover, .player-tile.discard-mode:active {
            transform: translateY(-15px);
            box-shadow: 2px 15px 10px rgba(0,0,0,0.3);
            border: 2px solid #fbbf24; /* Yellow highlight on hover/touch */
        }

        .discard-tile {
            font-size: 3.5vw;
            width: 3vw;
            height: 4vw;
            border-radius: 4px;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.3);
        }

        .discard-latest {
            border: 2px solid #fef08a;
            box-shadow: 0 0 10px #fef08a;
            transform: scale(1.05);
        }

        .btn-large {
            background: linear-gradient(to bottom, #fde047, #eab308);
            color: #713f12;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.5);
            text-shadow: 0 1px 1px rgba(255,255,255,0.5);
            transition: all 0.1s;
        }
        
        .btn-large:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-disabled {
            background: #9ca3af;
            color: #4b5563;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .pulse-anim {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(253, 224, 71, 0); }
            100% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">

    <!-- Top Status Bar -->
    <header class="flex justify-between items-center p-4 bg-black/30 text-xl font-bold">
        <div>剩餘牌數: <span id="deck-count" class="text-yellow-300 text-2xl">--</span></div>
        <button onclick="confirmRestart()" class="px-4 py-2 bg-red-700/80 hover:bg-red-600 rounded-lg text-white shadow">重新開始</button>
    </header>

    <!-- Discard Area (Center) -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-black/20 rounded-xl w-11/12 max-w-5xl h-[40vh] p-4 overflow-y-auto flex flex-wrap content-start gap-1 shadow-inner border border-white/10" id="discard-pile">
            <!-- Discarded tiles will appear here -->
        </div>
    </main>

    <!-- Player Area (Bottom) -->
    <section class="h-[35vh] flex flex-col justify-end pb-6 px-2 bg-gradient-to-t from-black/60 to-transparent">
        
        <!-- Status & Controls -->
        <div class="flex justify-between items-end mb-4 px-8 max-w-7xl mx-auto w-full">
            <div id="status-text" class="text-3xl md:text-4xl font-extrabold tracking-wide text-yellow-300 drop-shadow-md">
                準備開始遊戲...
            </div>
            <div class="flex gap-4">
                <button id="btn-win" onclick="declareWin()" class="hidden btn-large text-2xl font-bold py-3 px-8 rounded-2xl">
                    我胡了！
                </button>
                <button id="btn-draw" onclick="playerDraw()" class="btn-large pulse-anim text-3xl font-bold py-4 px-10 rounded-2xl">
                    摸牌
                </button>
            </div>
        </div>

        <!-- Player Hand -->
        <div class="flex justify-center items-end gap-[0.2vw] w-full" id="player-hand">
            <!-- Tiles will be rendered here -->
        </div>
    </section>

    <!-- Message Modal -->
    <div id="message-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white text-gray-800 p-10 rounded-3xl max-w-md w-full text-center shadow-2xl transform transition-transform scale-95">
            <h2 id="modal-title" class="text-4xl font-extrabold text-red-600 mb-6">恭喜胡牌！</h2>
            <p id="modal-desc" class="text-xl mb-8 text-gray-600">奶奶好棒！您的頭腦非常清晰喔！</p>
            <button onclick="startNewGame()" class="btn-large text-2xl w-full py-4 rounded-xl font-bold">
                再來一局
            </button>
            <button onclick="closeModal()" id="modal-cancel" class="mt-4 text-gray-500 hover:text-gray-800 text-lg w-full py-2">
                取消
            </button>
        </div>
    </div>

    <script>
        // --- Tile Definitions ---
        const SUITS = [
            { type: 'M', chars: ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'], base: 300 }, // 萬 (Characters)
            { type: 'S', chars: ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'], base: 400 }, // 索 (Bamboos)
            { type: 'P', chars: ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'], base: 500 }, // 筒 (Dots)
            { type: 'W', chars: ['🀀','🀁','🀂','🀃'], base: 100 }, // 風 (Winds: E, S, W, N)
            { type: 'D', chars: ['🀄','🀅','🀆'], base: 200 }  // 元 (Dragons: Red, Green, White)
        ];

        // --- Game State ---
        let deck = [];
        let playerHand = [];
        let botHands = [[], [], []];
        let discards = [];
        
        let turn = 0; // 0 = Player, 1 = Bot1, 2 = Bot2, 3 = Bot3
        let phase = 'draw'; // 'draw' | 'discard' | 'wait'
        let justDrawnTileId = null;

        // --- DOM Elements ---
        const elDeckCount = document.getElementById('deck-count');
        const elDiscardPile = document.getElementById('discard-pile');
        const elPlayerHand = document.getElementById('player-hand');
        const elStatusText = document.getElementById('status-text');
        const btnDraw = document.getElementById('btn-draw');
        const btnWin = document.getElementById('btn-win');
        const modal = document.getElementById('message-modal');

        function buildDeck() {
            let newDeck = [];
            let idCounter = 0;
            SUITS.forEach(suit => {
                suit.chars.forEach((char, index) => {
                    for(let i=0; i<4; i++) {
                        newDeck.push({
                            id: idCounter++,
                            char: char,
                            type: suit.type,
                            val: index + 1,
                            sortVal: suit.base + index + 1
                        });
                    }
                });
            });
            return newDeck;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function sortHand(hand) {
            hand.sort((a, b) => a.sortVal - b.sortVal);
        }

        function startNewGame() {
            closeModal();
            deck = buildDeck();
            shuffle(deck);
            discards = [];
            justDrawnTileId = null;
            
            // Deal 16 tiles to everyone
            playerHand = deck.splice(0, 16);
            sortHand(playerHand);
            
            botHands = [
                deck.splice(0, 16),
                deck.splice(0, 16),
                deck.splice(0, 16)
            ];

            turn = 0;
            phase = 'draw';
            updateUI();
        }

        function playerDraw() {
            if (turn !== 0 || phase !== 'draw' || deck.length === 0) return;
            
            const tile = deck.pop();
            playerHand.push(tile);
            justDrawnTileId = tile.id;
            
            phase = 'discard';
            updateUI();
            
            // Auto scroll discard pile to bottom if needed
            elDiscardPile.scrollTop = elDiscardPile.scrollHeight;
        }

        function playerDiscard(tileId) {
            if (turn !== 0 || phase !== 'discard') return;

            const index = playerHand.findIndex(t => t.id === tileId);
            if (index === -1) return;

            const tile = playerHand.splice(index, 1)[0];
            discards.push(tile);
            justDrawnTileId = null;
            
            sortHand(playerHand);
            
            phase = 'wait';
            turn = 1;
            updateUI();
            
            // Trigger Bots
            setTimeout(botTurn, 800);
        }

        function botTurn() {
            if (deck.length === 0) {
                checkGameOver();
                return;
            }

            const botIndex = turn - 1;
            
            // Bot Draws
            botHands[botIndex].push(deck.pop());
            
            // Bot Discards (Completely random for simplicity)
            const randDiscardIndex = Math.floor(Math.random() * botHands[botIndex].length);
            const discardedTile = botHands[botIndex].splice(randDiscardIndex, 1)[0];
            discards.push(discardedTile);

            // Move to next turn
            turn = (turn + 1) % 4;
            updateUI();
            elDiscardPile.scrollTop = elDiscardPile.scrollHeight;

            if (turn === 0) {
                // Back to player
                phase = 'draw';
                checkGameOver();
                updateUI();
            } else {
                // Next bot
                setTimeout(botTurn, 800);
            }
        }

        function updateUI() {
            // 1. Update Deck Count
            elDeckCount.innerText = deck.length;

            // 2. Update Status Banner & Buttons
            if (turn === 0) {
                if (phase === 'draw') {
                    elStatusText.innerText = "你的回合：請點擊【摸牌】";
                    elStatusText.className = "text-3xl md:text-4xl font-extrabold tracking-wide text-green-300 drop-shadow-md";
                    btnDraw.classList.remove('hidden', 'btn-disabled');
                    btnDraw.classList.add('pulse-anim');
                    btnDraw.disabled = false;
                    btnWin.classList.add('hidden');
                } else if (phase === 'discard') {
                    elStatusText.innerText = "請選擇並點擊一張牌打出";
                    elStatusText.className = "text-3xl md:text-4xl font-extrabold tracking-wide text-yellow-300 drop-shadow-md";
                    btnDraw.classList.add('btn-disabled');
                    btnDraw.classList.remove('pulse-anim');
                    btnDraw.disabled = true;
                    btnWin.classList.remove('hidden'); // Show Win button during discard phase
                }
            } else {
                elStatusText.innerText = `電腦 ${turn} 思考中...`;
                elStatusText.className = "text-3xl md:text-4xl font-extrabold tracking-wide text-gray-300 drop-shadow-md";
                btnDraw.classList.add('btn-disabled');
                btnDraw.classList.remove('pulse-anim');
                btnDraw.disabled = true;
                btnWin.classList.add('hidden');
            }

            // 3. Render Discards
            elDiscardPile.innerHTML = '';
            discards.forEach((tile, index) => {
                const isLatest = index === discards.length - 1;
                const div = document.createElement('div');
                div.className = `tile tile-font discard-tile ${isLatest ? 'discard-latest' : ''}`;
                div.innerText = tile.char;
                elDiscardPile.appendChild(div);
            });

            // 4. Render Player Hand
            elPlayerHand.innerHTML = '';
            playerHand.forEach((tile) => {
                const isJustDrawn = tile.id === justDrawnTileId;
                const div = document.createElement('div');
                
                // Add margin to visually separate the newly drawn tile
                let extraMargin = isJustDrawn ? 'ml-[2vw]' : '';
                let interactiveClass = (phase === 'discard' && turn === 0) ? 'discard-mode' : '';
                
                div.className = `tile tile-font player-tile ${extraMargin} ${interactiveClass}`;
                div.innerText = tile.char;
                
                if (phase === 'discard' && turn === 0) {
                    // Use onmousedown/ontouchstart for faster iPad response
                    div.onclick = () => playerDiscard(tile.id);
                }
                
                elPlayerHand.appendChild(div);
            });
        }

        function checkGameOver() {
            if (deck.length === 0) {
                showModal('牌局結束', '大家平手！再玩一局吧！', false);
            }
        }

        function declareWin() {
            showModal('恭喜胡牌！', '奶奶好厲害！您的頭腦非常清晰喔！繼續保持！', false);
        }

        function confirmRestart() {
            showModal('重新開始', '確定要放棄這局，重新洗牌嗎？', true);
        }

        function showModal(title, desc, showCancel) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-title').className = title === '恭喜胡牌！' 
                ? 'text-5xl font-extrabold text-red-600 mb-6' 
                : 'text-4xl font-bold text-gray-800 mb-6';
            document.getElementById('modal-desc').innerText = desc;
            
            if (showCancel) {
                document.getElementById('modal-cancel').classList.remove('hidden');
            } else {
                document.getElementById('modal-cancel').classList.add('hidden');
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        // Start the first game on load
        window.onload = () => {
            startNewGame();
        };
    </script>
</body>
</html>
