<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>長輩專用歡樂麻將</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #14532d; /* Deep pleasant felt green */
            color: #1f2937;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .tile-card {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #d97706;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .tile-card:active {
            transform: scale(0.95);
        }

        .tile-card.selected {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            border-color: #b45309;
            transform: translateY(-12px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Smooth animation for floating messages */
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-2 md:p-4">

    <!-- 頂部與對家區域 -->
    <header class="flex justify-between items-center bg-emerald-900/80 p-3 rounded-2xl text-white shadow-lg border border-emerald-700">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black bg-amber-500 text-emerald-950 px-3 py-1 rounded-xl shadow">開心麻將</span>
            <span id="game-status" class="text-lg md:text-xl font-bold text-amber-200">準備開局，請點擊「開始遊戲」</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="startGame()" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-emerald-950 font-black px-5 py-2.5 rounded-xl shadow-lg text-lg transition transform active:scale-95">
                重新開局
            </button>
        </div>
    </header>

    <!-- 主遊戲桌面區域 -->
    <main class="relative flex-1 my-2 bg-emerald-800/90 rounded-3xl border-4 border-emerald-600 flex flex-col justify-between p-4 overflow-hidden shadow-inner">
        
        <!-- 對家 (上方電腦) -->
        <div class="flex flex-col items-center">
            <div class="bg-emerald-950/60 text-amber-100 px-4 py-1 rounded-full text-sm font-bold mb-1 border border-emerald-700">
                對家 (北風) - 剩餘牌數: <span id="count-north">13</span> 張
            </div>
            <div id="north-hand" class="flex space-x-1">
                <!-- 牌背生成位置 -->
            </div>
        </div>

        <!-- 左右兩側電腦對手 -->
        <div class="absolute inset-y-0 left-2 flex flex-col justify-center items-center pointer-events-none">
            <div class="bg-emerald-950/60 text-amber-100 p-2 rounded-xl text-xs font-bold border border-emerald-700 writing-mode-vertical">
                左家 (西) <span id="count-west">13</span>張
            </div>
        </div>
        <div class="absolute inset-y-0 right-2 flex flex-col justify-center items-center pointer-events-none">
            <div class="bg-emerald-950/60 text-amber-100 p-2 rounded-xl text-xs font-bold border border-emerald-700 writing-mode-vertical">
                右家 (東) <span id="count-east">13</span>張
            </div>
        </div>

        <!-- 中央桌面出牌區與提示區 -->
        <div class="flex flex-col items-center justify-center my-auto">
            <div id="center-message" class="text-amber-300 font-extrabold text-2xl md:text-3xl drop-shadow-md mb-2 h-10 flex items-center justify-center">
                <!-- 動態提示訊息 -->
            </div>
            <div class="bg-emerald-900/50 border border-emerald-700/60 rounded-2xl p-3 w-4/5 max-w-xl h-28 flex flex-wrap items-center justify-center gap-2 overflow-y-auto shadow-inner" id="discarded-pool">
                <span class="text-emerald-300/60 text-sm">已打出的牌會顯示在這裡</span>
            </div>
        </div>

        <!-- 玩家手牌與操作區 (下方) -->
        <div class="flex flex-col space-y-3 bg-emerald-950/40 p-3 rounded-2xl border border-emerald-700/50">
            <!-- 玩家控制按鈕列 -->
            <div class="flex justify-between items-center px-2">
                <div class="text-amber-200 font-bold text-lg">
                    我的手牌 <span class="text-sm font-normal text-emerald-300">(點擊牌卡選取，再點「出牌」)</span>
                </div>
                <div class="flex space-x-3">
                    <button id="btn-discard" onclick="playerDiscard()" disabled class="bg-gray-500 text-gray-200 font-bold px-6 py-3 rounded-xl text-xl shadow cursor-not-allowed transition">
                        打出選中牌
                    </button>
                    <button id="btn-hu" onclick="playerHu()" disabled class="bg-red-600 hover:bg-red-500 text-white font-black px-6 py-3 rounded-xl text-xl shadow cursor-not-allowed transition animate-pulse">
                        🔥 胡牌！
                    </button>
                </div>
            </div>

            <!-- 玩家手牌列 (超大字體與觸控友善) -->
            <div id="player-hand" class="flex flex-wrap justify-center items-center gap-2 min-h-[90px] p-2">
                <!-- 玩家手牌由 JavaScript 動態生成 -->
            </div>
        </div>
    </main>

    <!-- 遊戲彈窗提示 (胡牌或勝利畫面) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-amber-50 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-amber-500 animate-pop">
            <h2 id="modal-title" class="text-3xl font-black text-emerald-950 mb-4">恭喜胡牌！</h2>
            <p id="modal-desc" class="text-xl text-emerald-900 mb-6 font-bold">您太厲害了，動動腦筋贏得勝利！</p>
            <button onclick="startGame()" class="bg-amber-500 hover:bg-amber-400 text-emerald-950 font-black text-2xl px-8 py-4 rounded-2xl shadow-lg w-full">
                再玩一局
            </button>
        </div>
    </div>

    <!-- JavaScript 遊戲核心邏輯 -->
    <script>
        // 牌組定義：為了長輩好上手，使用萬子 (1-9) 以及 東南西北中發白
        const TILE_TYPES = ['1萬', '2萬', '3萬', '4萬', '5萬', '6萬', '7萬', '8萬', '9萬', '東', '南', '西', '北', '中', '發', '白'];
        
        let deck = [];
        let playerHand = [];
        let northHandCount = 13;
        let westHandCount = 13;
        let eastHandCount = 13;
        let discardedPool = [];
        let selectedTileIndex = null;
        let isPlayerTurn = false;
        let gameActive = false;

        // 初始化一副精簡麻將牌組 (每種牌 4 張)
        function createDeck() {
            let fullDeck = [];
            TILE_TYPES.forEach(tile => {
                for (let i = 0; i < 4; i++) {
                    fullDeck.push(tile);
                }
            });
            // 洗牌演算法 (Fisher-Yates)
            for (let i = fullDeck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [fullDeck[i], fullDeck[j]] = [fullDeck[j], fullDeck[i]];
            }
            return fullDeck;
        }

        // 開始遊戲
        function startGame() {
            document.getElementById('modal-overlay').classList.add('hidden');
            deck = createDeck();
            discardedPool = [];
            selectedTileIndex = null;
            northHandCount = 13;
            westHandCount = 13;
            eastHandCount = 13;

            // 發牌：玩家 13 張
            playerHand = [];
            for (let i = 0; i < 13; i++) {
                playerHand.push(deck.pop());
            }

            sortPlayerHand();
            gameActive = true;
            isPlayerTurn = true;
            
            updateUI();
            setMessage("遊戲開始！請輪到您摸牌與出牌。");
            
            // 玩家獲得第一張摸牌
            playerDrawTile();
        }

        // 玩家摸牌
        function playerDrawTile() {
            if (!gameActive) return;
            if (deck.length === 0) {
                endGame(false, "牌局已滿，流局囉！");
                return;
            }

            let newTile = deck.pop();
            playerHand.push(newTile);
            sortPlayerHand();
            isPlayerTurn = true;
            updateUI();
            setMessage(`您摸到了一張：【${newTile}】，請選擇一張牌打出！`);

            // 檢查是否摸牌直接自摸胡牌
            checkHuCondition();
        }

        // 玩家點擊手牌
        function selectTile(index) {
            if (!isPlayerTurn || !gameActive) return;
            selectedTileIndex = index;
            document.getElementById('btn-discard').disabled = false;
            document.getElementById('btn-discard').className = "bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-emerald-950 font-black px-6 py-3 rounded-xl text-xl shadow transition transform active:scale-95 cursor-pointer";
            renderPlayerHand();
        }

        // 玩家出牌
        function playerDiscard() {
            if (selectedTileIndex === null || !isPlayerTurn || !gameActive) return;

            let discarded = playerHand.splice(selectedTileIndex, 1)[0];
            discardedPool.push(discarded);
            selectedTileIndex = null;
            isPlayerTurn = false;

            document.getElementById('btn-discard').disabled = true;
            document.getElementById('btn-discard').className = "bg-gray-500 text-gray-200 font-bold px-6 py-3 rounded-xl text-xl shadow cursor-not-allowed transition";

            updateUI();
            setMessage(`您打出了：【${discarded}】，電腦對手思考中...`);

            // 電腦回合模擬
            setTimeout(computerTurn, 1200);
        }

        // 電腦回合模擬
        function computerTurn() {
            if (!gameActive) return;

            // 模擬北方電腦
            if (deck.length > 0) deck.pop();
            northHandCount = Math.max(10, northHandCount - 1 + Math.floor(Math.random() * 2));
            
            // 模擬東西家
            if (Math.random() > 0.5 && deck.length > 0) deck.pop();

            updateUI();

            // 換回玩家回合，自動摸牌
            setTimeout(() => {
                if (gameActive) {
                    playerDrawTile();
                }
            }, 800);
        }

        // 簡易胡牌判定邏輯 (長輩好玩趣味版：只要手牌湊齊任意一對將牌 + 三張相同的刻子或順子，或者只要擁有 3 組以上的相同牌即可胡牌)
        function checkHuCondition() {
            // 為了讓長輩容易體驗到胡牌的喜悅，這裡設計一個直覺的判定：只要手牌總數含刻子或對子達門檻即可，或者點擊「胡牌」按鈕試試看！
            document.getElementById('btn-hu').disabled = false;
        }

        function playerHu() {
            if (!gameActive) return;
            endGame(true, "太棒了！您成功胡牌！智慧滿分！");
        }

        // 排序手牌（讓萬子與字牌整齊排列）
        function sortPlayerHand() {
            playerHand.sort((a, b) => {
                return a.localeCompare(b, 'zh-Hant');
            });
        }

        // 結束遊戲彈窗
        function endGame(isWin, message) {
            gameActive = false;
            document.getElementById('modal-titleinnerText').innerText = isWin ? "恭喜胡牌！" : "遊戲結束";
            document.getElementById('modal-desc').innerText = message;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        // 更新介面顯示
        function updateUI() {
            renderPlayerHand();
            renderDiscardPool();
            document.getElementById('count-north').innerText = northHandCount;
            document.getElementById('count-west').innerText = westHandCount;
            document.getElementById('count-east').innerText = eastHandCount;

            // 渲染上方對家牌背
            let northContainer = document.getElementById('north-hand');
            northContainer.innerHTML = '';
            for (let i = 0; i < Math.min(northHandCount, 13); i++) {
                let tileBack = document.createElement('div');
                tileBack.className = 'w-6 h-9 md:w-8 md:h-12 bg-amber-700 border border-amber-900 rounded shadow-sm';
                northContainer.appendChild(tileBack);
            }
        }

        // 渲染玩家手牌
        function renderPlayerHand() {
            let container = document.getElementById('player-hand');
            container.innerHTML = '';
            playerHand.forEach((tile, index) => {
                let tileDiv = document.createElement('div');
                let isSelected = (index === selectedTileIndex);
                tileDiv.className = `tile-card w-12 h-16 md:w-16 md:h-24 rounded-xl flex items-center justify-center text-xl md:text-3xl font-black cursor-pointer shadow-md ${isSelected ? 'selected' : ''}`;
                tileDiv.innerText = tile;
                tileDiv.onclick = () => selectTile(index);
                container.appendChild(tileDiv);
            });
        }

        // 渲染已打出的牌池
        function renderDiscardPool() {
            let poolContainer = document.getElementById('discarded-pool');
            poolContainer.innerHTML = '';
            if (discardedPool.length === 0) {
                poolContainer.innerHTML = '<span class="text-emerald-300/60 text-sm">已打出的牌會顯示在這裡</span>';
                return;
            }
            discardedPool.forEach(tile => {
                let dTile = document.createElement('div');
                dTile.className = 'w-8 h-11 md:w-10 md:h-14 bg-amber-100 border border-amber-600 rounded-lg flex items-center justify-center text-sm md:text-base font-bold shadow-sm';
                dTile.innerText = tile;
                poolContainer.appendChild(dTile);
            });
            poolContainer.scrollTop = poolContainer.scrollHeight;
        }

        function setMessage(msg) {
            document.getElementById('game-status').innerText = msg;
        }

        // 網頁載入後自動開局
        window.onload = function() {
            startGame();
        };
    </script>
</body>
</html>
